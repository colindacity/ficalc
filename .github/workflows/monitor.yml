name: Deployment Monitor

on:
  # Disabled automatic schedule to prevent noise
  # Uncomment when deployment is stable
  # schedule:
  #   - cron: '*/15 * * * *'

  # Manual trigger only for now
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor Deployment Health
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        id: health
        continue-on-error: true
        run: |
          echo "Checking deployment health..."
          SITE_URL="https://colindacity.github.io/ficalc/"

          # Check if site is up (with retries)
          MAX_RETRIES=3
          RETRY_COUNT=0
          HTTP_CODE="000"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
            echo "Attempt $((RETRY_COUNT + 1)): HTTP Status Code: $HTTP_CODE"

            if [ "$HTTP_CODE" == "200" ]; then
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Site is down! Status code: $HTTP_CODE after $MAX_RETRIES attempts"
            exit 1
          fi

          # Check response time
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' "$SITE_URL")
          echo "Response time: ${RESPONSE_TIME}s"

          # Alert if response time is too slow (> 10 seconds, more lenient)
          if (( $(echo "$RESPONSE_TIME > 10.0" | bc -l) )); then
            echo "⚠️  Warning: Slow response time (${RESPONSE_TIME}s)"
          fi

          # Check if page contains critical content
          CONTENT=$(curl -s "$SITE_URL")
          if ! echo "$CONTENT" | grep -q "FI Calc"; then
            echo "⚠️  Warning: Critical content missing (may be loading issue)"
            # Don't fail on this, just warn
          fi

          echo "✅ All health checks passed"

      - name: Create issue if health check fails
        if: failure() && steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Deployment Health Check Failed';
            const body = `## Deployment Health Check Failed

            The automated health check for the deployment has failed after multiple retries.

            **Details:**
            - Time: ${new Date().toISOString()}
            - Workflow: ${context.workflow}
            - Run ID: ${context.runId}

            **Action Required:**
            1. Check the deployment at https://colindacity.github.io/ficalc/
            2. Review recent commits that may have caused the issue
            3. Consider running the rollback workflow if needed

            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})

            **Note:** This is a manual trigger only. Automatic monitoring is disabled to prevent noise.
            `;

            // Check if issue already exists (created in last 24 hours)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment-failure',
              since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['deployment-failure', 'automated']
              });
            } else {
              console.log('Recent issue already exists, skipping duplicate');
            }

      - name: Monitor summary
        if: always()
        run: |
          echo "===================="
          echo "Monitor Summary"
          echo "===================="
          echo "Health Check: ${{ steps.health.outcome }}"
          echo "Time: $(date)"
          echo "===================="
