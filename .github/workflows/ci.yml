name: CI/CD

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            dist/
            dist-cli/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages (Attempt 1)
        id: build-attempt-1
        continue-on-error: true
        run: npm run build
        env:
          PUBLIC_URL: /ficalc

      - name: Build for GitHub Pages (Attempt 2 - Retry)
        id: build-attempt-2
        if: steps.build-attempt-1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "First build failed, cleaning and retrying..."
          rm -rf dist node_modules/.vite
          npm run build
        env:
          PUBLIC_URL: /ficalc

      - name: Build for GitHub Pages (Attempt 3 - Final Retry)
        id: build-attempt-3
        if: steps.build-attempt-2.outcome == 'failure'
        run: |
          echo "Second build failed, full clean and retry..."
          rm -rf dist node_modules
          npm ci
          npm run build
        env:
          PUBLIC_URL: /ficalc

      - name: Verify build output
        run: |
          echo "Verifying build artifacts..."
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Error: index.html not found in dist!"
            exit 1
          fi
          echo "✅ Build artifacts verified successfully"
          ls -lah dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Attempt 1)
        id: deployment-attempt-1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment-attempt-1.outcome == 'failure'
        run: |
          echo "First deployment failed, waiting 30 seconds before retry..."
          sleep 30

      - name: Deploy to GitHub Pages (Attempt 2 - Retry)
        id: deployment-attempt-2
        if: steps.deployment-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deployment-attempt-2.outcome == 'failure'
        run: |
          echo "Second deployment failed, waiting 60 seconds before final retry..."
          sleep 60

      - name: Deploy to GitHub Pages (Attempt 3 - Final Retry)
        id: deployment-attempt-3
        if: steps.deployment-attempt-2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Set deployment URL
        id: deployment
        run: |
          if [ "${{ steps.deployment-attempt-1.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-1.outputs.page_url }}" >> $GITHUB_OUTPUT
          elif [ "${{ steps.deployment-attempt-2.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-2.outputs.page_url }}" >> $GITHUB_OUTPUT
          else
            echo "page_url=${{ steps.deployment-attempt-3.outputs.page_url }}" >> $GITHUB_OUTPUT
          fi

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')

    steps:
      - name: Wait for deployment to propagate
        run: |
          echo "Waiting 60 seconds for deployment to propagate..."
          sleep 60

      - name: Health check (Attempt 1)
        id: health-check-1
        continue-on-error: true
        run: |
          echo "Checking if site is accessible..."
          SITE_URL="https://colindacity.github.io/ficalc/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          echo "HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ Site is accessible!"
            exit 0
          else
            echo "❌ Site returned status code: $HTTP_CODE"
            exit 1
          fi

      - name: Wait before retry
        if: steps.health-check-1.outcome == 'failure'
        run: |
          echo "First health check failed, waiting 30 seconds..."
          sleep 30

      - name: Health check (Attempt 2)
        id: health-check-2
        if: steps.health-check-1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Retrying health check..."
          SITE_URL="https://colindacity.github.io/ficalc/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          echo "HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ Site is accessible!"
            exit 0
          else
            echo "❌ Site returned status code: $HTTP_CODE"
            exit 1
          fi

      - name: Wait before final retry
        if: steps.health-check-2.outcome == 'failure'
        run: |
          echo "Second health check failed, waiting 60 seconds..."
          sleep 60

      - name: Health check (Attempt 3 - Final)
        if: steps.health-check-2.outcome == 'failure'
        run: |
          echo "Final health check attempt..."
          SITE_URL="https://colindacity.github.io/ficalc/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          echo "HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ Site is accessible!"
            exit 0
          else
            echo "❌ Site still not accessible after 3 attempts"
            echo "Please check GitHub Pages settings and DNS propagation"
            exit 1
          fi

      - name: Verify site content
        run: |
          echo "Verifying site content..."
          SITE_URL="https://colindacity.github.io/ficalc/"

          # Check if page contains expected content
          CONTENT=$(curl -s "$SITE_URL")

          if echo "$CONTENT" | grep -q "FI Calc"; then
            echo "✅ Page contains expected title"
          else
            echo "⚠️  Warning: Page title not found"
          fi

          if echo "$CONTENT" | grep -q "Retirement"; then
            echo "✅ Page contains expected keywords"
          else
            echo "⚠️  Warning: Expected keywords not found"
          fi

          # Check for critical resources
          if echo "$CONTENT" | grep -q "script"; then
            echo "✅ JavaScript resources found"
          else
            echo "⚠️  Warning: No JavaScript resources detected"
          fi

      - name: Smoke test
        run: |
          echo "Running basic smoke tests..."
          SITE_URL="https://colindacity.github.io/ficalc/"

          # Test 1: Check if CSS is loading
          if curl -s "$SITE_URL" | grep -q "stylesheet\|style"; then
            echo "✅ CSS resources detected"
          else
            echo "⚠️  Warning: No CSS resources found"
          fi

          # Test 2: Check response time
          START_TIME=$(date +%s)
          curl -s "$SITE_URL" > /dev/null
          END_TIME=$(date +%s)
          RESPONSE_TIME=$((END_TIME - START_TIME))

          echo "Response time: ${RESPONSE_TIME}s"
          if [ $RESPONSE_TIME -lt 5 ]; then
            echo "✅ Response time acceptable"
          else
            echo "⚠️  Warning: Slow response time"
          fi

      - name: Deployment verification summary
        if: always()
        run: |
          echo "===================="
          echo "Deployment Summary"
          echo "===================="
          echo "Site URL: https://colindacity.github.io/ficalc/"
          echo "Health Check 1: ${{ steps.health-check-1.outcome }}"
          echo "Health Check 2: ${{ steps.health-check-2.outcome }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "===================="

          if [ "${{ steps.health-check-1.outcome }}" == "success" ] || \
             [ "${{ steps.health-check-2.outcome }}" == "success" ]; then
            echo "✅ Deployment verified successfully!"
            echo "🚀 Your app is live at: https://colindacity.github.io/ficalc/"
          else
            echo "⚠️  Deployment completed but verification had issues"
            echo "Please manually check: https://colindacity.github.io/ficalc/"
          fi
