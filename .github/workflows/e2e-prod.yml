name: E2E Production Tests

on:
  # Run after successful deployment
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed
    branches: [main, claude/**]

  # Allow manual triggering
  workflow_dispatch:

  # Disabled automatic schedule to prevent noise
  # Uncomment when deployment is stable and you want hourly checks
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  test-production:
    name: Test Production Deployment
    runs-on: ubuntu-latest
    # Only run if deployment succeeded OR manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify site is accessible before testing
        id: verify-site
        continue-on-error: true
        run: |
          echo "Checking if site is accessible..."
          SITE_URL="https://colindacity.github.io/ficalc/"

          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
            echo "Attempt $((RETRY_COUNT + 1)): HTTP Status Code: $HTTP_CODE"

            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Site is accessible!"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Site not ready, waiting 60 seconds..."
              sleep 60
            fi
          done

          echo "⚠️  Site not accessible after $MAX_RETRIES attempts"
          exit 1

      - name: Skip tests if site not accessible
        if: steps.verify-site.outcome == 'failure'
        run: |
          echo "::warning::Skipping E2E tests - site is not accessible yet"
          echo "This may be normal if deployment is still propagating"
          exit 0

      - name: Run E2E tests against production (Attempt 1)
        id: e2e-attempt-1
        if: steps.verify-site.outcome == 'success'
        continue-on-error: true
        run: npm run test:prod
        env:
          CI: true

      - name: Wait before retry
        if: steps.e2e-attempt-1.outcome == 'failure' && steps.verify-site.outcome == 'success'
        run: |
          echo "First test run failed, waiting 60 seconds..."
          sleep 60

      - name: Run E2E tests against production (Attempt 2)
        id: e2e-attempt-2
        if: steps.e2e-attempt-1.outcome == 'failure' && steps.verify-site.outcome == 'success'
        continue-on-error: true
        run: npm run test:prod
        env:
          CI: true

      - name: Wait before final retry
        if: steps.e2e-attempt-2.outcome == 'failure' && steps.verify-site.outcome == 'success'
        run: |
          echo "Second test run failed, waiting 120 seconds..."
          sleep 120

      - name: Run E2E tests against production (Attempt 3 - Final)
        id: e2e-attempt-3
        if: steps.e2e-attempt-2.outcome == 'failure' && steps.verify-site.outcome == 'success'
        run: npm run test:prod
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report-prod/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

      - name: Create issue if tests fail
        if: |
          failure() &&
          steps.verify-site.outcome == 'success' &&
          steps.e2e-attempt-3.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Production E2E Tests Failed';
            const body = `## Production E2E Tests Failed

            The end-to-end tests against the production deployment have failed after 3 attempts.

            **Details:**
            - Time: ${new Date().toISOString()}
            - Branch: ${context.ref}
            - Commit: ${context.sha}
            - Workflow Run: [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})

            **Test Results:**
            - Attempt 1: ${{ steps.e2e-attempt-1.outcome }}
            - Attempt 2: ${{ steps.e2e-attempt-2.outcome }}
            - Attempt 3: ${{ steps.e2e-attempt-3.outcome }}

            **Action Required:**
            1. Check the test report artifacts
            2. Review the video recordings of failures
            3. Investigate the production deployment
            4. Consider rolling back if critical functionality is broken

            **Test Report:**
            Download the test report from the [workflow artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId}).
            `;

            // Check if issue already exists (in last 24 hours)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure,production',
              since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['e2e-failure', 'production', 'automated']
              });
            } else {
              console.log('Recent E2E failure issue already exists, skipping duplicate');
            }

      - name: Test summary
        if: always()
        run: |
          echo "===================="
          echo "Production E2E Test Summary"
          echo "===================="
          echo "Site Verification: ${{ steps.verify-site.outcome }}"
          echo "Test Run 1: ${{ steps.e2e-attempt-1.outcome }}"
          echo "Test Run 2: ${{ steps.e2e-attempt-2.outcome }}"
          echo "Test Run 3: ${{ steps.e2e-attempt-3.outcome }}"
          echo "Production URL: https://colindacity.github.io/ficalc/"
          echo "===================="

          if [ "${{ steps.verify-site.outcome }}" != "success" ]; then
            echo "⚠️  Site verification failed - tests were skipped"
            echo "This is normal if deployment hasn't completed or GitHub Pages isn't set up yet"
            exit 0
          elif [ "${{ steps.e2e-attempt-1.outcome }}" == "success" ]; then
            echo "✅ All production tests passed on first attempt!"
          elif [ "${{ steps.e2e-attempt-2.outcome }}" == "success" ]; then
            echo "✅ Production tests passed on second attempt"
          elif [ "${{ steps.e2e-attempt-3.outcome }}" == "success" ]; then
            echo "✅ Production tests passed on third attempt"
          else
            echo "❌ Production tests failed after 3 attempts"
            exit 1
          fi
