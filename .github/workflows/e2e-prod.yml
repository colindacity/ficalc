name: E2E Production Tests

on:
  # Run after successful deployment
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed
    branches: [main, claude/**]

  # Allow manual triggering
  workflow_dispatch:

  # Run on schedule (every hour)
  schedule:
    - cron: '0 * * * *'

jobs:
  test-production:
    name: Test Production Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 60

      - name: Run E2E tests against production (Attempt 1)
        id: e2e-attempt-1
        continue-on-error: true
        run: npm run test:prod
        env:
          CI: true

      - name: Wait before retry
        if: steps.e2e-attempt-1.outcome == 'failure'
        run: |
          echo "First test run failed, waiting 60 seconds..."
          sleep 60

      - name: Run E2E tests against production (Attempt 2)
        id: e2e-attempt-2
        if: steps.e2e-attempt-1.outcome == 'failure'
        continue-on-error: true
        run: npm run test:prod
        env:
          CI: true

      - name: Wait before final retry
        if: steps.e2e-attempt-2.outcome == 'failure'
        run: |
          echo "Second test run failed, waiting 120 seconds..."
          sleep 120

      - name: Run E2E tests against production (Attempt 3 - Final)
        id: e2e-attempt-3
        if: steps.e2e-attempt-2.outcome == 'failure'
        run: npm run test:prod
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-prod
          path: playwright-report-prod/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 7

      - name: Create issue if tests fail
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Production E2E Tests Failed';
            const body = `## Production E2E Tests Failed

            The end-to-end tests against the production deployment have failed.

            **Details:**
            - Time: ${new Date().toISOString()}
            - Branch: ${context.ref}
            - Commit: ${context.sha}
            - Workflow Run: [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})

            **Test Results:**
            - Attempt 1: ${{ steps.e2e-attempt-1.outcome }}
            - Attempt 2: ${{ steps.e2e-attempt-2.outcome }}
            - Attempt 3: ${{ steps.e2e-attempt-3.outcome }}

            **Action Required:**
            1. Check the test report artifacts
            2. Review the video recordings of failures
            3. Investigate the production deployment
            4. Consider rolling back if critical functionality is broken

            **Test Report:**
            Download the test report from the [workflow artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId}).
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure,production'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['e2e-failure', 'production', 'automated']
              });
            }

      - name: Test summary
        if: always()
        run: |
          echo "===================="
          echo "Production E2E Test Summary"
          echo "===================="
          echo "Test Run 1: ${{ steps.e2e-attempt-1.outcome }}"
          echo "Test Run 2: ${{ steps.e2e-attempt-2.outcome }}"
          echo "Test Run 3: ${{ steps.e2e-attempt-3.outcome }}"
          echo "Production URL: https://colindacity.github.io/ficalc/"
          echo "===================="

          if [ "${{ steps.e2e-attempt-1.outcome }}" == "success" ]; then
            echo "✅ All production tests passed on first attempt!"
          elif [ "${{ steps.e2e-attempt-2.outcome }}" == "success" ]; then
            echo "✅ Production tests passed on second attempt"
          elif [ "${{ steps.e2e-attempt-3.outcome }}" == "success" ]; then
            echo "✅ Production tests passed on third attempt"
          else
            echo "❌ Production tests failed after 3 attempts"
            exit 1
          fi
